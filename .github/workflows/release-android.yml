name: Release Recite Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release containing the signed APK
        required: true
        type: string
      publish_github:
        description: Publish the APK as the latest stable GitHub release
        type: boolean
        default: false
      publish_update:
        description: Sync the APK to the in-app update feed used by existing installs
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recite-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      APK_SIGNER: 228ac57f44fac1cce4f4f5e49ab98574435b599de9be7c43783878ca834af66f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and validate signed APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "$*" >&2; exit 1; }
          [[ $RELEASE_TAG =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]] || fail 'Invalid release tag'
          version="${RELEASE_TAG#v}"
          apk="ToastFish-$version.apk"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -e --arg apk "$apk" '([.assets[] | select(.name == $apk and .state == "uploaded")] | length == 1)' >/dev/null ||
            fail 'Expected one uploaded APK for this version'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$apk" --dir "$RUNNER_TEMP"
          file="$RUNNER_TEMP/$apk"
          tools=$(for dir in "$ANDROID_HOME"/build-tools/*; do
            if [[ -x "$dir/aapt2" && -f "$dir/lib/apksigner.jar" ]]; then printf '%s\n' "$dir"; fi
          done | sort -V | tail -1)
          [[ -n $tools ]] || fail 'No installed Android build-tools with aapt2 and apksigner'
          cat > "$RUNNER_TEMP/VerifyApk.java" <<'JAVA'
          import com.android.apksig.ApkVerifier;
          import java.io.File;
          import java.security.MessageDigest;
          import java.util.HexFormat;
          class VerifyApk {
              public static void main(String[] args) throws Exception {
                  var result = new ApkVerifier.Builder(new File(args[0])).build().verify();
                  if (!result.isVerified()) throw new IllegalArgumentException("Invalid APK: " + result.getErrors());
                  var signers = result.getSignerCertificates();
                  if (signers.size() != 1) throw new IllegalArgumentException("Unexpected APK signer count: " + signers.size());
                  var digest = MessageDigest.getInstance("SHA-256").digest(signers.get(0).getEncoded());
                  System.out.println(HexFormat.of().formatHex(digest));
              }
          }
          JAVA
          signer=$(java -cp "$tools/lib/apksigner.jar" "$RUNNER_TEMP/VerifyApk.java" "$file") ||
            fail 'APK signature verification failed'
          [[ $signer == "$APK_SIGNER" ]] || fail "Unexpected APK certificate: $signer"
          badging=$("$tools/aapt2" dump badging "$file")
          package=$(grep '^package: ' <<< "$badging")
          [[ $package == "package: name='com.toastfish.mobile' versionCode="* ]] || fail "Unexpected APK package: $package"
          [[ $package == *" versionName='$version'"* ]] || fail "APK version differs from tag: $package"
          build=$(sed -E "s/.* versionCode='([0-9]+)'.*/\1/" <<< "$package")
          [[ $build =~ ^[1-9][0-9]{0,9}$ ]] && (( build <= 2100000000 )) || fail 'Invalid versionCode'
          printf 'apk=%s\nbuild=%s\nversion=%s\n' "$file" "$build" "$version" >> "$GITHUB_OUTPUT"
          sha256sum "$file"

      - name: Sync in-app update feed
        if: inputs.publish_update
        env:
          APK: ${{ steps.apk.outputs.apk }}
          BUILD: ${{ steps.apk.outputs.build }}
          VERSION: ${{ steps.apk.outputs.version }}
          MANIFEST_KEY: ${{ secrets.RECITE_UPDATE_MANIFEST_KEY }}
          SSH_KEY: ${{ secrets.RECITE_UPDATE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MANIFEST_KEY" && -n "$SSH_KEY" ]]
          umask 077
          work=$(mktemp -d)
          trap 'rm -f "$work/manifest.pem" "$work/deploy" "$work/release.bvu"; rmdir "$work"' EXIT
          printf '%s\n' "$MANIFEST_KEY" > "$work/manifest.pem"
          printf '%s\n' "$SSH_KEY" > "$work/deploy"
          unset MANIFEST_KEY SSH_KEY
          export RELEASE_NOTES="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          export RELEASE_DATE="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -er --arg apk "$(basename "$APK")" '.assets[] | select(.name == $apk) | .createdAt')"
          python3 scripts/prepare-recite-update.py "$APK" "$VERSION" "$BUILD" "$work/manifest.pem" "$work/release.bvu"
          ssh -F /dev/null -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=scripts/bytevirt-known-hosts \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            -p 22016 -i "$work/deploy" recite-update@154.26.235.59 publish-v1 < "$work/release.bvu"
          curl --fail --silent --show-error --retry 3 \
            https://update.0979019203.top/dictionary/beta/android/latest.json > "$RUNNER_TEMP/recite-latest.json"
          python3 scripts/prepare-recite-update.py check "$work/release.bvu" "$RUNNER_TEMP/recite-latest.json"

      - name: Publish latest stable GitHub release
        if: inputs.publish_github
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true \
            --title "Recite ${RELEASE_TAG#v} · Android"
