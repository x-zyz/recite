name: Release Recite Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release containing the signed APK
        required: true
        type: string
      publish_github:
        description: Publish the GitHub draft as a beta prerelease
        type: boolean
        default: false
      publish_update:
        description: Publish to the Recite beta update feed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recite-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      APK_SIGNER: 363fc640c9ad79930fb9fc95a228f0e7856704f25e183483681635f6c01e3649
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and validate signed APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          version="${RELEASE_TAG#v}"
          apk="ToastFish-$version.apk"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets |
            jq -e --arg apk "$apk" '(.isDraft or .isPrerelease) and ([.assets[] | select(.name == $apk and .state == "uploaded")] | length == 1)' >/dev/null
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$apk" --dir "$RUNNER_TEMP"
          file="$RUNNER_TEMP/$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          [[ -x "$tools/aapt" && -x "$tools/apksigner" ]]
          "$tools/apksigner" verify --print-certs "$file" > "$RUNNER_TEMP/recite-certs"
          mapfile -t signers < <(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "$RUNNER_TEMP/recite-certs")
          [[ ${#signers[@]} == 1 && ${signers[0]} == "$APK_SIGNER" ]]
          badging=$("$tools/aapt" dump badging "$file")
          package=$(grep '^package: ' <<< "$badging")
          [[ $package == "package: name='com.toastfish.mobile' versionCode="* ]]
          [[ $package == *" versionName='$version'"* ]]
          build=$(sed -E "s/.* versionCode='([0-9]+)'.*/\1/" <<< "$package")
          [[ $build =~ ^[1-9][0-9]{0,9}$ ]] && (( build <= 2100000000 ))
          printf 'apk=%s\nbuild=%s\nversion=%s\n' "$file" "$build" "$version" >> "$GITHUB_OUTPUT"
          sha256sum "$file"

      - name: Publish beta update feed
        if: inputs.publish_update
        env:
          APK: ${{ steps.apk.outputs.apk }}
          BUILD: ${{ steps.apk.outputs.build }}
          VERSION: ${{ steps.apk.outputs.version }}
          MANIFEST_KEY: ${{ secrets.RECITE_UPDATE_MANIFEST_KEY }}
          SSH_KEY: ${{ secrets.RECITE_UPDATE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MANIFEST_KEY" && -n "$SSH_KEY" ]]
          umask 077
          work=$(mktemp -d)
          trap 'rm -f "$work/manifest.pem" "$work/deploy" "$work/release.bvu"; rmdir "$work"' EXIT
          printf '%s\n' "$MANIFEST_KEY" > "$work/manifest.pem"
          printf '%s\n' "$SSH_KEY" > "$work/deploy"
          unset MANIFEST_KEY SSH_KEY
          export RELEASE_NOTES="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          export RELEASE_DATE="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -er --arg apk "$(basename "$APK")" '.assets[] | select(.name == $apk) | .createdAt')"
          python3 scripts/prepare-recite-update.py "$APK" "$VERSION" "$BUILD" "$work/manifest.pem" "$work/release.bvu"
          ssh -F /dev/null -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=scripts/bytevirt-known-hosts \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            -i "$work/deploy" bytevirt-updates@141.11.138.234 publish-v1 < "$work/release.bvu"
          curl --fail --silent --show-error --retry 3 \
            https://update.0979019203.top/dictionary/beta/android/latest.json > "$RUNNER_TEMP/recite-latest.json"
          python3 scripts/prepare-recite-update.py check "$work/release.bvu" "$RUNNER_TEMP/recite-latest.json"

      - name: Publish GitHub beta prerelease
        if: inputs.publish_github
        shell: bash
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
